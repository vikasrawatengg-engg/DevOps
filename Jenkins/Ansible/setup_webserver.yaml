---
- name: End-to-End Apache and HTML Deployment
  hosts: webservers
  become: true
  tasks:

    - name: Create the HTML file on the main machine
      delegate_to: localhost
      become: false
      copy:
        dest: ./index.html
        content: |
          <!DOCTYPE html>
          <html>
          <head>
              <title>Ansible Automation Success</title>
              <style>
                  body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #f4f6f9; }
                  .container { background: white; padding: 30px; display: inline-block; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
                  h1 { color: #005577; }
                  p { color: #555; }
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>Ansible Playbook Completed!</h1>
                  <p>This page was generated on the main machine and deployed automatically to this managed node.</p>
              </div>
          </body>
          </html>

    - name: Install Apache on the target machine
      dnf:
        name: httpd
        state: present
        update_cache: yes

    - name: Start and enable Apache service
      service:
        name: httpd
        state: started
        enabled: yes

    - name: Copy the HTML file from the main machine to the target machine
      copy:
        src: ./index.html
        dest: /var/www/html/index.html
        owner: apache
        group: apache
        mode: '0644'